<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pausencountdown</title>

        <!-- Using Bulma Framework -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
        />

        <style>
            html {
                background-color: #000000;
            }

            body {
                margin: 0;
                padding: 0;
                overflow: hidden;
            }

            .parent {
                display: flex;
                justify-content: center; /* Horizontal center */
                align-items: center; /* Vertical center */
                height: 100vh; /* Full viewport height */
                width: 100vw; /* Full viewport width */
            }

            .parent > div {
                zoom: 200%;
            }

            .countdown {
                font-size: 2.5rem; /* Large font for countdown */
                font-weight: bold; /* Bold font */
                margin-top: 1rem; /* Margin at the top */
            }
        </style>
    </head>
    <body>
        <div class="parent">
            <div style="text-align: center">
                <h2 id="info" class="subtitle"></h2>
                <h1 id="countdown" class="title countdown"></h1>
            </div>
        </div>
        <script>
            function pad(n) {
                return n < 10 ? "0" + n : n;
            }

            function getNextTarget(now) {
                // Time windows and target times
                const today = new Date(
                    now.getFullYear(),
                    now.getMonth(),
                    now.getDate()
                );
                const times = [
                    {
                        windowStart: new Date(today.getTime()), // 00:00
                        windowEnd: new Date(
                            today.getTime() +
                                8 * 60 * 60 * 1000 +
                                20 * 60 * 1000
                        ), // 08:20
                        target: new Date(
                            today.getTime() + 8 * 60 * 60 * 1000 + 5 * 60 * 1000
                        ), // 08:05
                        label: "Schulbeginn 08:05 Uhr",
                    },
                    {
                        windowStart: new Date(
                            today.getTime() +
                                8 * 60 * 60 * 1000 +
                                20 * 60 * 1000
                        ), // 08:20
                        windowEnd: new Date(
                            today.getTime() +
                                10 * 60 * 60 * 1000 +
                                20 * 60 * 1000
                        ), // 10:20
                        target: new Date(
                            today.getTime() + 9 * 60 * 60 + 55 * 60 * 1000
                        ), // 09:55
                        label: "Pausenende 09:55 Uhr",
                    },
                    {
                        windowStart: new Date(
                            today.getTime() + 10 * 60 * 60 + 20 * 60 * 1000
                        ), // 10:20
                        windowEnd: new Date(
                            today.getTime() + 12 * 60 * 60 * 1000
                        ), // 12:00
                        target: new Date(
                            today.getTime() + 11 * 60 * 60 + 45 * 60 * 1000
                        ), // 11:45
                        label: "Pausenende 11:45 Uhr",
                    },
                    {
                        windowStart: new Date(
                            today.getTime() + 12 * 60 * 60 * 1000
                        ), // 12:00
                        windowEnd: new Date(
                            today.getTime() + 14 * 60 * 60 + 15 * 60 * 1000
                        ), // 14:15
                        target: new Date(today.getTime() + 14 * 60 * 60 * 1000), // 14:00
                        label: "Pausenende 14:00 Uhr",
                    },
                    {
                        windowStart: new Date(
                            today.getTime() + 14 * 60 * 60 + 15 * 60 * 1000
                        ), // 14:15
                        windowEnd: new Date(
                            today.getTime() + 24 * 60 * 60 * 1000
                        ), // 24:00
                        target: new Date(
                            today.getTime() +
                                24 * 60 * 60 * 1000 +
                                8 * 60 * 60 * 1000 +
                                5 * 60 * 1000
                        ), // 08:05 next day
                        label: "Schulbeginn Morgen 08:05 Uhr",
                    },
                ];

                for (let t of times) {
                    if (now >= t.windowStart && now < t.windowEnd) {
                        return t;
                    }
                }
                // If after 24:00, show next day's first window
                return times[0];
            }

            function updateCountdown() {
                const now = new Date();
                const t = getNextTarget(now);
                const diff = t.target - now;
                const info = document.getElementById("info");
                const countdown = document.getElementById("countdown");

                let absDiff = Math.abs(diff);
                let hours = Math.floor(absDiff / (1000 * 60 * 60));
                let minutes = Math.floor(
                    (absDiff % (1000 * 60 * 60)) / (1000 * 60)
                );
                let seconds = Math.floor((absDiff % (1000 * 60)) / 1000);

                if (diff >= 0) {
                    info.textContent = t.label;
                    countdown.textContent = `${pad(hours)}:${pad(
                        minutes
                    )}:${pad(seconds)}`;
                } else {
                    info.textContent = t.label + " (vergangen)";
                    countdown.textContent = `-${pad(hours)}:${pad(
                        minutes
                    )}:${pad(seconds)}`;
                }
            }

            setInterval(updateCountdown, 1000);
            updateCountdown();
        </script>
    </body>
</html>
