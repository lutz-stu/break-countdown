<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pausencount" />
    <title>Pausencountdown</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="images/icon512.png" />
    <link rel="icon" href="images/icon.svg" type="image/svg+xml" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="images/icon-inverted.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)" />
    <!-- Using Bulma Framework -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <script>
      // Check for embedded mode via URL parameter (for OBS, etc.)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('embedded') === 'true') {
        document.body.classList.add('embedded-mode');
      }
    </script>

    <button id="fullscreen-btn" title="Vollbildmodus">⛶</button>
    <div class="parent">
      <div style="text-align: center">
        <h2 id="info" class="subtitle"></h2>
        <h1 id="countdown" class="title countdown"></h1>
      </div>
    </div>

    <!-- Scripts in correct load order -->
    <script src="js/config-loader.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/fullscreen.js"></script>
    <script>
      // Initialize app after all scripts are loaded
      loadConfig();
      startCountdown();
    </script>
  </body>
</html>
